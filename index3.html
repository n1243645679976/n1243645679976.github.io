<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>YouTube 片段播放器</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #111217;
    --panel: #1B1D24;
    --panel-2: #22242D;
    --border: #2E313C;
    --text: #ECEAE6;
    --text-dim: #9B9FAE;
    --accent: #F2A93B;
    --accent-dim: rgba(242,169,59,0.16);
    --accent-text: #4A2E05;
    --radius: 10px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans TC', system-ui, sans-serif;
  }

  body { padding: 32px 24px 60px; }

  .page {
    max-width: 1180px;
    margin: 0 auto;
  }

  header.app-header {
    margin-bottom: 24px;
  }

  header.app-header h1 {
    font-family: 'Noto Serif TC', serif;
    font-weight: 700;
    font-size: 26px;
    margin: 0 0 4px;
    letter-spacing: 0.5px;
  }

  header.app-header p {
    margin: 0;
    color: var(--text-dim);
    font-size: 13px;
  }

  /* ---- toolbar ---- */
  .toolbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 14px;
    margin-bottom: 20px;
  }

  .toggle-chip {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 7px 12px 7px 8px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--panel-2);
    font-size: 13px;
    color: var(--text-dim);
    cursor: pointer;
    user-select: none;
    transition: border-color .15s ease, color .15s ease, background .15s ease;
  }

  .toggle-chip input { display: none; }

  .toggle-chip .dot {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #3A3D48;
    position: relative;
    flex-shrink: 0;
    transition: background .15s ease;
  }

  .toggle-chip input:checked ~ .dot {
    background: var(--accent);
  }

  .toggle-chip input:checked ~ .dot::after {
    content: '';
    position: absolute;
    inset: 4px;
    border-radius: 50%;
    background: #14151A;
  }

  .toggle-chip:has(input:checked) {
    color: var(--text);
    border-color: var(--accent);
    background: var(--accent-dim);
  }

  .spacer { flex: 1; }

  button {
    font-family: inherit;
    font-size: 13px;
    color: var(--text);
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 9px 14px;
    cursor: pointer;
    transition: border-color .15s ease, background .15s ease;
  }

  button:hover { border-color: #454955; background: #282B35; }
  button:active { transform: scale(0.98); }

  button.primary {
    background: var(--accent);
    color: var(--accent-text);
    border-color: var(--accent);
    font-weight: 500;
  }
  button.primary:hover { background: #ffbf5c; }

  button.ghost {
    background: transparent;
  }

  /* ---- main layout ---- */
  .layout {
    display: grid;
    grid-template-columns: 320px 1fr;
    gap: 20px;
    align-items: start;
  }

  @media (max-width: 860px) {
    .layout { grid-template-columns: 1fr; }
  }

  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }

  .panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
    color: var(--text-dim);
  }

  .panel-header .count {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    background: var(--panel-2);
    border-radius: 999px;
    padding: 2px 8px;
  }

  /* video list */
  .video-list {
    list-style: none;
    margin: 0;
    padding: 6px;
    max-height: 560px;
    overflow-y: auto;
  }

  .video-list::-webkit-scrollbar { width: 8px; }
  .video-list::-webkit-scrollbar-thumb { background: #333644; border-radius: 4px; }

  .video-list-item {
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    margin-bottom: 4px;
    padding: 9px 10px;
    border-radius: 8px;
    border: 1px solid transparent;
    transition: background .12s ease, border-color .12s ease;
  }

  .video-list-item:hover { background: var(--panel-2); }

  .video-list-item.active {
    background: var(--accent-dim);
    border-color: var(--accent);
  }

  .video-list-item .badge {
    flex-shrink: 0;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 3px 6px;
    min-width: 44px;
    text-align: center;
  }

  .video-list-item.active .badge {
    color: var(--accent-text);
    background: var(--accent);
    border-color: var(--accent);
  }

  .video-list-item .name {
    font-size: 13.5px;
    line-height: 1.3;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .empty-hint {
    padding: 30px 16px;
    text-align: center;
    color: var(--text-dim);
    font-size: 13px;
  }

  /* player panel */
  .player-panel .panel-header { min-height: 40px; }

  .now-playing {
    font-size: 13px;
    color: var(--text);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .player-wrap {
    background: #000;
    aspect-ratio: 16 / 9;
    width: 100%;
  }

  #player { width: 100%; height: 100%; }

  /* editor */
  .editor-panel { margin-top: 20px; }

  .editor-body { padding: 14px; }

  textarea {
    width: 100%;
    min-height: 160px;
    resize: vertical;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12.5px;
    line-height: 1.6;
    padding: 12px;
  }

  textarea:focus { outline: none; border-color: var(--accent); }

  .editor-actions {
    display: flex;
    gap: 10px;
    margin-top: 10px;
  }

  .editor-hint {
    font-size: 12px;
    color: var(--text-dim);
    margin: 0 0 10px;
  }

  .editor-hint code {
    font-family: 'JetBrains Mono', monospace;
    background: var(--panel-2);
    border-radius: 4px;
    padding: 1px 5px;
  }
</style>
</head>
<body>
<div class="page">

  <header class="app-header">
    <h1>YouTube 片段播放器</h1>
    <p>從你的清單挑選片段，設定播放模式後開始播放</p>
  </header>

  <div class="toolbar">
    <label class="toggle-chip">
      <input type="checkbox" id="continuousPlayback">
      <span class="dot"></span>連續播放
    </label>
    <label class="toggle-chip">
      <input type="checkbox" id="autoPlay">
      <span class="dot"></span>自動播放（不推薦）
    </label>
    <label class="toggle-chip">
      <input type="checkbox" id="randomPlay">
      <span class="dot"></span>隨機播放
    </label>
    <div class="spacer"></div>
    <button id="shuffleButton" class="ghost">🔀 重新洗牌</button>
  </div>

  <div class="layout">
    <div class="panel list-panel">
      <div class="panel-header">
        <span>播放清單</span>
        <span class="count" id="videoCount">0</span>
      </div>
      <ul class="video-list" id="videoList"></ul>
    </div>

    <div class="panel player-panel">
      <div class="panel-header">
        <span class="now-playing" id="nowPlaying">尚未選擇片段</span>
      </div>
      <div class="player-wrap">
        <div id="player"></div>
      </div>
    </div>
  </div>

  <div class="panel editor-panel">
    <div class="panel-header">
      <span>編輯播放清單</span>
    </div>
    <div class="editor-body">
      <p class="editor-hint">每行一筆，格式為 <code>videoID, 名稱, 開始時間, 結束時間</code>（時間可用 <code>mm:ss</code> 或 <code>hh:mm:ss</code>）</p>
      <textarea id="userInput"></textarea>
      <div class="editor-actions">
        <button class="primary" onclick="saveData()">儲存並套用</button>
        <button class="ghost" onclick="clearUserInput()">清除內容</button>
      </div>
    </div>
  </div>

</div>

<script>
  function clearUserInput() {
    localStorage.removeItem("userInput");
    document.getElementById("userInput").value = "";
  }

  var tag = document.createElement('script');
  tag.src = 'https://www.youtube.com/iframe_api';
  var firstScriptTag = document.getElementsByTagName('script')[0];
  firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

  var player;
  var videoData = [];
  var isContinuousPlayback = false;
  var isRandomPlay = false;
  var isAutoPlay = false;
  var Index = 0;

  var shuffledVideoData = [];
  var shuffledIndex = 0;

  function onYouTubeIframeAPIReady() {
    player = new YT.Player('player', {
      host: 'https://www.youtube.com',
      height: '100%',
      width: '100%',
      playerVars: { autoplay: 0 },
      events: {
        'onReady': onPlayerReady,
        'onStateChange': onPlayerStateChange
      }
    });
  }

  function onPlayerReady(event) {
    var userInput = localStorage.getItem("userInput");
    if (userInput) {
      document.getElementById("userInput").value = userInput;
      videoData = parseFileContent(userInput);
      showVideoList(videoData);
    } else {
      fetch('input.txt')
        .then(response => response.text())
        .then(fileContent => {
          videoData = parseFileContent(fileContent);
          showVideoList(videoData);
          localStorage.setItem("userInput", fileContent);
          document.getElementById("userInput").value = fileContent;
        });
    }
  }

  function parseFileContent(content) {
    var lines = content.split(/\r\n|\n/);
    var videoData = [];
    for (var i = 0; i < lines.length; i++) {
      var parts = lines[i].split(',');
      if (parts.length === 4) {
        var videoID = parts[0].trim();
        var name = parts[1].trim();
        var startTime = parseTime(parts[2].trim());
        var endTime = parseTime(parts[3].trim());
        videoData.push({ i, videoID, name, startTime, endTime });
      }
    }
    return videoData;
  }

  function parseTime(timeString) {
    var timeParts = timeString.split(':');
    var seconds = 0;
    if (timeParts.length === 3) {
      seconds += parseInt(timeParts[0]) * 3600;
      seconds += parseInt(timeParts[1]) * 60;
      seconds += parseInt(timeParts[2]);
    } else if (timeParts.length === 2) {
      seconds += parseInt(timeParts[0]) * 60;
      seconds += parseInt(timeParts[1]);
    } else if (timeParts.length === 1) {
      seconds += parseInt(timeParts[0]);
    }
    return seconds;
  }

  function formatTime(totalSeconds) {
    totalSeconds = Math.max(0, Math.floor(totalSeconds || 0));
    var h = Math.floor(totalSeconds / 3600);
    var m = Math.floor((totalSeconds % 3600) / 60);
    var s = totalSeconds % 60;
    var mm = (h > 0 ? String(m).padStart(2, '0') : String(m));
    var ss = String(s).padStart(2, '0');
    return h > 0 ? (h + ':' + mm + ':' + ss) : (mm + ':' + ss);
  }

  function showVideoList(videoData) {
    var videoListElement = document.getElementById('videoList');
    var countElement = document.getElementById('videoCount');
    videoListElement.innerHTML = '';
    countElement.textContent = videoData.length;

    if (videoData.length === 0) {
      videoListElement.innerHTML = '<li class="empty-hint">清單目前是空的，請在下方編輯區加入片段</li>';
      return;
    }

    videoData.forEach(function (video) {
      var listItem = document.createElement('li');
      listItem.classList.add('video-list-item');
      listItem.dataset.index = video.i;

      var badge = document.createElement('span');
      badge.className = 'badge';
      badge.textContent = formatTime(video.startTime);

      var name = document.createElement('span');
      name.className = 'name';
      name.textContent = video.name;

      listItem.appendChild(badge);
      listItem.appendChild(name);

      listItem.addEventListener('click', function () {
        playVideo(video.i, video.videoID, video.startTime, video.endTime);
      });
      videoListElement.appendChild(listItem);
    });
  }

  function setActiveListItem(index) {
    document.querySelectorAll('.video-list-item').forEach(function (el) {
      el.classList.toggle('active', Number(el.dataset.index) === Number(index));
    });
  }

  function playVideo(i, videoID, startTime, endTime) {
    Index = i;
    var video = videoData[i];
    document.getElementById('nowPlaying').textContent = video ? video.name : '';
    setActiveListItem(i);

    if (player) {
      if (isAutoPlay) {
        player.loadVideoById({ videoId: videoID, startSeconds: startTime, endSeconds: endTime, suggestedQuality: 'default' });
      } else {
        player.cueVideoById({ videoId: videoID, startSeconds: startTime, endSeconds: endTime, suggestedQuality: 'default' });
      }
    }
  }

  var continuousPlaybackCheckbox = document.getElementById('continuousPlayback');
  continuousPlaybackCheckbox.addEventListener('change', function () {
    isContinuousPlayback = continuousPlaybackCheckbox.checked;
  });

  var autoPlayCheckbox = document.getElementById('autoPlay');
  autoPlayCheckbox.addEventListener('change', function () {
    isAutoPlay = autoPlayCheckbox.checked;
  });

  var randomPlayCheckbox = document.getElementById('randomPlay');
  randomPlayCheckbox.addEventListener('change', function () {
    isRandomPlay = randomPlayCheckbox.checked;
    if (isRandomPlay) {
      shuffledVideoData = shuffleArray([...videoData]);
      shuffledIndex = 0;
    }
  });

  document.getElementById('shuffleButton').addEventListener('click', function () {
    shuffledVideoData = shuffleArray([...videoData]);
    shuffledIndex = 0;
  });

  function shuffleArray(array) {
    for (let i = array.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [array[i], array[j]] = [array[j], array[i]];
    }
    return array;
  }

  function playNextVideo() {
    if (isContinuousPlayback && Index < videoData.length) {
      if (isRandomPlay) {
        if (shuffledIndex >= shuffledVideoData.length) {
          shuffledVideoData = shuffleArray([...videoData]);
          shuffledIndex = 0;
        }
        const currentVideo = shuffledVideoData[shuffledIndex];
        playVideo(currentVideo.i, currentVideo.videoID, currentVideo.startTime, currentVideo.endTime);
        shuffledIndex++;
      } else if (Index + 1 < videoData.length) {
        var nextVideo = videoData[Index + 1];
        playVideo(nextVideo.i, nextVideo.videoID, nextVideo.startTime, nextVideo.endTime);
      }
    }
  }

  function onPlayerStateChange(event) {
    if (event.data === YT.PlayerState.ENDED && isContinuousPlayback) {
      setTimeout(function () {
        playNextVideo();
      }, 3000);
    }
  }

  function saveData() {
    var userInput = document.getElementById("userInput").value;
    localStorage.setItem("userInput", userInput);
    videoData = parseFileContent(userInput);
    showVideoList(videoData);
  }
</script>
</body>
</html>
